
name: Build MineLoad APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip -o MineLoad_Package_Ready_Actions_v5.zip -d extracted
          find extracted -type f

      - name: Build APK
        run: |
          cd extracted
          P=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$P" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          cd "$(dirname "$P")"
          gradle assembleDebug
          APK=$(find . -path '*build/outputs/apk/debug/*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not generated"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/مدیریت-معدن.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MineLoad-APK
          path: apk-output/*.apk
